<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Báo cáo tuần · FI SAIGON</title>
  <meta name="robots" content="noindex" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="report.css" />
</head>
<body>
  <div class="rpx" id="rpxRoot">
    <!-- Thanh trên -->
    <header class="rpx-top">
      <div class="rpx-brand">
        <span class="rpx-logo">FIS</span>
        <div class="rpx-title">
          <b>Báo cáo tuần</b>
          <small>FI SAIGON JSC</small>
        </div>
      </div>
      <div class="rpx-user" id="rpxUser" hidden>
        <div class="rpx-user-meta">
          <b id="rpxUserName">—</b>
          <small id="rpxUserRole">—</small>
        </div>
        <button class="rpx-btn-ghost" id="rpxSignOut" type="button">Đăng xuất</button>
      </div>
    </header>

    <!-- Các trạng thái toàn trang -->
    <main class="rpx-main">
      <!-- Đang tải -->
      <section class="rpx-state" id="rpxLoading">
        <div class="rpx-spin" aria-hidden="true"></div>
        <p id="rpxLoadingMsg">Đang tải…</p>
      </section>

      <!-- Cần đăng nhập -->
      <section class="rpx-state" id="rpxSignin" hidden>
        <div class="rpx-state-card">
          <h1>Đăng nhập để xem báo cáo</h1>      
          <button class="rpx-btn-primary" id="rpxSignIn" type="button">
            Đăng nhập Microsoft
          </button>
          <p class="rpx-hint" id="rpxSigninHint"></p>
        </div>
      </section>

      <!-- Không có quyền -->
      <section class="rpx-state" id="rpxDenied" hidden>
        <div class="rpx-state-card">
          <h1>Bạn không có quyền xem trang này</h1>
          <p id="rpxDeniedMsg">Liên hệ với Administrator.</p>
          <button class="rpx-btn-ghost" id="rpxDeniedSignOut" type="button">
            Đăng nhập tài khoản khác
          </button>
        </div>
      </section>

      <!-- Nội dung chính -->
      <section class="rpx-portal" id="rpxPortal" hidden>
        <!-- Dải tóm tắt nộp báo cáo tuần này (span cả 2 cột) -->
        <div class="rpx-summary" id="rpxSummary" hidden></div>
        <!-- Cột trái -->
        <aside class="rpx-list-col">
          <div class="rpx-filters">
            <label class="rpx-field">
              <span>Sales</span>
              <select id="rpxFilterPic"><option value="">Tất cả sales</option></select>
            </label>
            <label class="rpx-field">
              <span>Tuần</span>
              <select id="rpxFilterWeek"><option value="">Tất cả tuần</option></select>
            </label>
          </div>
          <div class="rpx-list" id="rpxList" role="list"></div>
        </aside>

        <!-- Cột phải -->
        <div class="rpx-detail" id="rpxDetail"></div>
      </section>
    </main>

    <footer class="rpx-foot">
      <span>FI SAIGON — Sales Funnel · Báo cáo tuần</span>
    </footer>
  </div>

  <!-- Thư viện ngoài (giống app chính: jsdelivr + fallback unpkg) -->
  <script src="https://cdn.jsdelivr.net/npm/@azure/msal-browser@3/lib/msal-browser.min.js" onerror="this.onerror=null;var s=document.createElement('script');s.src='https://unpkg.com/@azure/msal-browser@3/lib/msal-browser.min.js';document.head.appendChild(s);"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js" onerror="this.onerror=null;var s=document.createElement('script');s.src='https://unpkg.com/chart.js@4.4.0/dist/chart.umd.min.js';document.head.appendChild(s);"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

  <!-- Module tái dùng của app (không sửa) -->
  <script src="js/sp-config.js"></script>
  <script src="js/lib/roles.js"></script>
  <script src="js/graph.js"></script>

  <!-- Riêng cho trang này -->
  <script src="js/report/report-auth.js"></script>
  <script src="js/report/report-page.js"></script>
</body>
</html>
