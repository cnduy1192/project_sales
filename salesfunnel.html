<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FI SAIGON — Sales Funnel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Outfit:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@azure/msal-browser@3/lib/msal-browser.min.js" onerror="this.onerror=null;var s=document.createElement('script');s.src='https://unpkg.com/@azure/msal-browser@3/lib/msal-browser.min.js';document.head.appendChild(s);"></script>
<link rel="stylesheet" href="styles.css?v=21">
<link rel="stylesheet" href="ui-kit.css?v=21">
<link rel="stylesheet" href="funnel.css?v=21">
<link rel="stylesheet" href="funnel-sf.css?v=1">
</head>
<body class="sf-body">

<!-- ══════════ LOGIN ══════════ -->
<div id="sfLogin">
  <div class="login-card glass">
    <div class="logo"><div class="logo-mark">FI</div>FI SAIGON <span style="color:var(--text-3);font-weight:600">JSC</span></div>
    <h1>Sales Funnel</h1>
    <p>Đăng nhập bằng tài khoản Email FISG</p>
    <button class="ms-btn">
      <svg width="18" height="18" viewBox="0 0 21 21"><rect x="1" y="1" width="9" height="9" fill="#F25022"/><rect x="11" y="1" width="9" height="9" fill="#7FBA00"/><rect x="1" y="11" width="9" height="9" fill="#00A4EF"/><rect x="11" y="11" width="9" height="9" fill="#FFB900"/></svg>
      Đăng nhập bằng Microsoft 365
    </button>
    <a class="sf-login-back" href="index.html">← Quay lại trang chủ</a>
  </div>
</div>

<!-- ══════════ APP ══════════ -->
<div id="sfApp">
  <header class="sf-top">
    <a class="sf-home" href="index.html" title="Về app chính">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>
    </a>
    <div class="sf-brand"><span class="logo-mark">FI</span><span class="sf-brand-t">Sales Funnel</span><span class="sf-brand-tag">Project workspace</span></div>
    <div class="sf-ncc" id="sfNcc" role="tablist" aria-label="Nhà cung cấp"></div>
    <div class="sf-search">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
      <input id="sfQ" placeholder="Tìm khách hàng, sản phẩm" oninput="SF.render()" aria-label="Tìm nhanh">
    </div>
    <span class="sf-user" id="sfUser"></span>
  </header>

  <div class="sf-subbar">
    <div class="sf-seg" id="sfStatusSeg" role="group" aria-label="Lọc trạng thái">
      <button class="sf-seg-b on" data-st="IN PROGRESS" onclick="SF.setStatus('IN PROGRESS')">Đang chạy</button>
      <button class="sf-seg-b" data-st="WON" onclick="SF.setStatus('WON')">Thắng</button>
      <button class="sf-seg-b" data-st="LOST" onclick="SF.setStatus('LOST')">Thua</button>
    </div>
    <div class="sf-view-toggle" id="sfViewToggle" role="group" aria-label="Kiểu hiển thị">
      <button class="sf-vt-b on" data-view="board" onclick="SF.setView('board')" title="Bảng Kanban">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="4" width="5" height="16" rx="1.4"/><rect x="10" y="4" width="5" height="11" rx="1.4"/><rect x="17" y="4" width="4" height="14" rx="1.4"/></svg>
        <span>Kanban</span></button>
      <button class="sf-vt-b" data-view="list" onclick="SF.setView('list')" title="Danh sách">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M8 6h13M8 12h13M8 18h13"/><circle cx="4" cy="6" r="1.3"/><circle cx="4" cy="12" r="1.3"/><circle cx="4" cy="18" r="1.3"/></svg>
        <span>Danh sách</span></button>
    </div>
    <div class="sf-stats" id="sfStats"></div>
  </div>

  <main class="sf-main">
    <div class="sf-board" id="sfBoard"></div>
    <div class="sf-list" id="sfList" hidden></div>
    <div class="sf-empty" id="sfEmpty" hidden></div>
  </main>
</div>

<!-- ══════════ RECORD PAGE OVERLAY ══════════ -->
<div class="sf-rec-bd" id="sfRecBd" onclick="SF.closeRecord()"></div>
<aside class="sf-rec" id="sfRec" role="dialog" aria-modal="true" aria-labelledby="sfRecTitle" tabindex="-1"></aside>

<div class="toast" id="toastEl"></div>

<script src="js/sp-config.js?v=21"></script>
<script src="js/data/catalog.js?v=21"></script>
<script src="js/config.js?v=21"></script>
<script src="js/lib/insights.js?v=21"></script>
<script src="js/lib/cleanname.js?v=21"></script>
<script src="js/lib/roles.js?v=21"></script>
<script src="js/lib/localstore.js?v=21"></script>
<script src="js/graph.js?v=21"></script>
<script src="js/store.js?v=21"></script>
<script src="js/views/funnel-sf.js?v=1"></script>
<script src="js/auth.js?v=21"></script>
</body>
</html>
